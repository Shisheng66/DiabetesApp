spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./backend/.env[.properties]
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:diabetes_health}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept
    allow-credentials: false
    max-age: 3600
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 604800
  auth:
    captcha-expire-seconds: 180
    sms-expire-seconds: 300
    sms-cooldown-seconds: 60
    expose-debug-sms-code: ${APP_AUTH_EXPOSE_DEBUG_SMS_CODE:false}
  sms:
    provider: ${APP_SMS_PROVIDER:http}
    endpoint: ${APP_SMS_ENDPOINT:}
    token: ${APP_SMS_TOKEN:}
    signature: ${APP_SMS_SIGNATURE:}
    template-id: ${APP_SMS_TEMPLATE_ID:}
