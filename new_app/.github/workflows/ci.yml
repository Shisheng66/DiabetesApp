name: Flutter CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify release API endpoint is configured
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "Set repository secret API_BASE_URL to the production HTTPS backend before building release artifacts."
            exit 1
          fi
          case "${{ secrets.API_BASE_URL }}" in
            https://*) ;;
            *) echo "API_BASE_URL must start with https://"; exit 1 ;;
          esac
